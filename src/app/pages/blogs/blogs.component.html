<div class="projects-container">
  <div *ngFor="let article of articles" class="project-item" [ngClass]="{'single-line-description': article.description.indexOf('.') === article.description.length - 1 || article.description.indexOf('?') === article.description.length - 1 || article.description.indexOf('!') === article.description.length - 1}">
    <h3>{{ article.title }}</h3>
    <p class="description">{{ article.description }}</p>
    <p class="technologies">Platform: {{ article.platform }}</p>
    <a href="{{ article.link }}" target="_blank">
<i class="fas fa-newspaper fa-2x"></i>
    </a>
  </div>
</div>
