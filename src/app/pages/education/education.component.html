<div class="education-container">
  <div *ngFor="let education of educationData" class="education-item">
    <h3>{{ education.institution }}</h3>
    <h4>{{ education.degree }}</h4>
    <p class="duration">{{ education.duration }} | {{ education.location }}</p>
    <p class="cgpa" *ngIf="education.cgpa">{{ education.cgpa }}</p>
    <p class="percentage" *ngIf="education.percentage">{{ education.percentage }}</p>
  </div>
</div>
